log_format context_safe '$remote_addr $request_method $uri $status $request_time';
server {
 access_log /var/log/nginx/access.log context_safe;
 # Upstream error messages can contain query tokens; application errors use requestId.
 error_log /dev/null;
 listen 80;
 resolver 127.0.0.11 valid=5s ipv6=off;
 client_max_body_size 26m;
 location /api/v1/ {
  set $api_upstream api:4000;
  proxy_pass http://$api_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_buffering off;
  proxy_read_timeout 650s;
 }
 location / { set $web_upstream web:3000; proxy_pass http://$web_upstream; proxy_set_header Host $host; }
}
