name: context-${APP_MODE:-demo}
x-app: &app
  build: .
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql://context:${POSTGRES_PASSWORD:-context_local_only}@postgres:5432/context
    REDIS_URL: redis://redis:6379
    STORAGE_ROOT: /data/files
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
  volumes: [files:/data/files]
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: context
      POSTGRES_USER: context
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-context_local_only}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U context'], interval: 3s, timeout: 3s, retries: 30}
  redis:
    image: redis:7.4.5-bookworm
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 30}
  migrate:
    <<: *app
    command: [sh, -c, 'pnpm db:migrate && if [ "$$APP_MODE" = demo ]; then pnpm db:seed:demo; fi']
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *app
    command: [pnpm, api]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: [pnpm, worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    <<: *app
    command: [pnpm, --filter, '@context/web', start]
    environment:
      <<: *environment
      INTERNAL_API_URL: http://api:4000
    depends_on: [api]
  ingress:
    image: nginx:1.28.0-bookworm
    ports: ['3000:80']
    volumes: ['./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api, web]
  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [demo, development]
    ports: ['127.0.0.1:8025:8025']
volumes:
  database:
  redis:
  files:
