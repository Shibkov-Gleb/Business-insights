name: Качество интерпретации
description: Обоснованность, персонализация или банковская атрибуция
title: "[Качество] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: Тип проблемы
      options:
        - Неверное основание или цитата
        - Банковская атрибуция или устаревший тезис
        - Нерелевантное событие или ранжирование
        - Неподтверждённая причинная связь
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Синтетический пример и ожидаемая проверка
      description: Укажите SHA, ракурс и публичные основания. Для закрытой компании используйте приватный экспертный экран приложения, не GitHub issue.
    validations:
      required: true
