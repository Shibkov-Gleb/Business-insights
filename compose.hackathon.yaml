name: context-alfa-hackathon
x-app: &app
  build: { context: ., dockerfile: Dockerfile.hackathon }
  image: context-alfa-hackathon:local
  env_file: .env
  environment: &env
    APP_VARIANT: alfa
    APP_MODE: ${APP_MODE:-demo}
    PUBLIC_APP_URL: http://localhost:3010
    DATABASE_URL: postgresql://context:${POSTGRES_PASSWORD:-alfa_local_only}@postgres:5432/context
    REDIS_URL: redis://redis:6379
    STORAGE_ROOT: /data/files
    HACKATHON_DATA_ROOT: /case
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
  volumes: ["alfa-files:/data/files", "./.hackathon:/case"]
  restart: unless-stopped
services:
  postgres:
    image: postgres:17.6-bookworm
    environment: { POSTGRES_DB: context, POSTGRES_USER: context, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-alfa_local_only}" }
    ports: ["127.0.0.1:15433:5432"]
    volumes: ["alfa-database:/var/lib/postgresql/data"]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U context"], interval: 3s, timeout: 3s, retries: 30 }
  redis:
    image: redis:7.4.5-bookworm
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:16380:6379"]
    volumes: ["alfa-redis:/data"]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 30 }
  migrate:
    <<: *app
    command: [sh, -c, "pnpm db:migrate && pnpm hackathon:import && pnpm hackathon:seed"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
  api:
    <<: *app
    command: [pnpm, api]
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 5s, timeout: 5s, retries: 30 }
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  worker:
    <<: *app
    command: [pnpm, worker]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
  web:
    <<: *app
    command: [pnpm, --filter, "@context/web", start]
    environment: { <<: *env, INTERNAL_API_URL: "http://api:4000" }
    depends_on: { api: { condition: service_healthy } }
  ingress:
    image: nginx:1.28.0-bookworm
    ports: ["127.0.0.1:3010:80"]
    volumes: ["./infra/nginx.hackathon.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, web]
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:8030:8025"]
volumes:
  alfa-database:
  alfa-redis:
  alfa-files:
